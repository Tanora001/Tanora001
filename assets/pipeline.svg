y="1" letter-spacing="0">Tripo / Blender → glTF，只同步 UUID 与 Transform</text><rect x="48" y="252" width="2" height="46" fill="#a996c4" opacity="0.7"/><text x="66" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#a996c4" text-anchor="start">C</text><text x="66" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="300" fill="#ece7e0" text-anchor="start" opacity="1" letter-spacing="0">混合</text><text x="178" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">可破坏的家具、箱子 —— 轮廓用体素，细节用网格</text><text x="560" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#6f675c" text-anchor="start" opacity="1" letter-spacing="0">Remesh → 调色板量化 → 体素校验</text>
