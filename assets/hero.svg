<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Tanora Vic — 造一个能住在电脑里的角色">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0c0e14"/>
      <stop offset="0.55" stop-color="#0a0c11"/>
      <stop offset="1" stop-color="#07080b"/>
    </linearGradient>

    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8a06a" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#e8a06a" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#e8a06a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7f9dc9" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7f9dc9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="win" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </linearGradient>

    <linearGradient id="capsule" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f6ebdf"/>
      <stop offset="1" stop-color="#dcc9b7"/>
    </linearGradient>

    <filter id="soft" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="round"><rect width="1000" height="380" rx="20"/></clipPath>
    <clipPath id="winclip"><rect x="592" y="84" width="328" height="192" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="380" fill="url(#bg)"/>
    <ellipse cx="770" cy="150" rx="420" ry="300" fill="url(#warm)"/>
    <ellipse cx="40" cy="380" rx="360" ry="220" fill="url(#cool)"/>

    <!-- 网格 -->
    <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
      <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000M0 240H1000M0 280H1000M0 320H1000M0 360H1000"/>
      <path d="M120 0V380M240 0V380M360 0V380M480 0V380M600 0V380M720 0V380M840 0V380M960 0V380"/>
    </g>

    <!-- 左侧发丝线 -->
    <path d="M-40 128 Q 260 114 540 128" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    <path d="M-40 306 Q 240 292 500 306" fill="none" stroke="#e8a06a" stroke-opacity="0.13"/>

    <!-- 星点 -->
    <g fill="#ffffff">
      <circle cx="164" cy="54" r="1.1" opacity="0.32">
        <animate attributeName="opacity" values="0.32;0.1;0.32" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="520" cy="46" r="1.3" opacity="0.45">
        <animate attributeName="opacity" values="0.45;0.14;0.45" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" cy="82" r="0.9" opacity="0.2"/>
      <circle cx="944" cy="60" r="1" opacity="0.26"/>
      <circle cx="340" cy="352" r="1" opacity="0.2"/>
      <circle cx="600" cy="336" r="1.1" opacity="0.26">
        <animate attributeName="opacity" values="0.26;0.08;0.26" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- 右侧：产品小窗 -->
    <g>
      <circle cx="756" cy="180" r="196" fill="none" stroke="#e8a06a" stroke-opacity="0.06"/>
      <circle cx="756" cy="180" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="1 8"/>

      <rect x="592" y="84" width="328" height="192" rx="16" fill="url(#win)"/>

      <g clip-path="url(#winclip)">
        <!-- 地面透视 -->
        <g stroke="#ffffff" stroke-opacity="0.055" stroke-width="1" fill="none">
          <path d="M756 168 L560 300M756 168 L652 300M756 168 L756 300M756 168 L860 300M756 168 L960 300"/>
        </g>
        <g stroke="#ffffff" stroke-width="1">
          <path d="M592 178H920" stroke-opacity="0.07"/>
          <path d="M592 208H920" stroke-opacity="0.045"/>
          <path d="M592 246H920" stroke-opacity="0.03"/>
        </g>

        <!-- 暖光 -->
        <ellipse cx="756" cy="252" rx="120" ry="38" fill="#ffd9b5" opacity="0.16" filter="url(#soft)">
          <animate attributeName="opacity" values="0.16;0.24;0.16" dur="6.5s" repeatCount="indefinite"/>
        </ellipse>

        <!-- 对话胶囊 -->
        <rect x="686" y="236" width="140" height="26" rx="13" fill="url(#capsule)"/>
        <rect x="686" y="236" width="140" height="26" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
        <rect x="696" y="242" width="120" height="6" rx="3" fill="#ffffff" opacity="0.4"/>

        <!-- 角标 -->
        <g stroke="#e8a06a" stroke-opacity="0.3" stroke-width="1.2" fill="none">
          <path d="M604 100h10M604 100v10"/>
          <path d="M908 100h-10M908 100v10"/>
          <path d="M604 260h10M604 260v-10"/>
          <path d="M908 260h-10M908 260v-10"/>
        </g>
      </g>

      <text x="614" y="106" font-family="Consolas, 'Cascadia Mono', monospace" font-size="9" letter-spacing="2.2" fill="#8b8175">S.A.T.I.O</text>
      <circle cx="898" cy="103" r="2.4" fill="#e8a06a" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.3;0.85" dur="3.6s" repeatCount="indefinite"/>
      </circle>

      <rect x="592.5" y="84.5" width="327" height="191" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

      <circle cx="942" cy="180" r="3.2" fill="#e8a06a" opacity="0.9">
        <animateTransform attributeName="transform" type="rotate" from="0 756 180" to="360 756 180" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="180" r="2.4" fill="#9db6d8" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="360 756 180" to="0 756 180" dur="40s" repeatCount="indefinite"/>
      </circle>

      <text x="756" y="316" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="9.5" letter-spacing="2.4" fill="#8b8175">PROTOTYPE · RUNNING LOCAL</text>
    </g>

    <!-- 左侧文案 -->
    <text x="56" y="70" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" letter-spacing="4.2" fill="#c9a180" fill-opacity="0.9">S.A.T.I.O · PERSONAL WORLD</text>

    <text x="54" y="156" font-family="'Segoe UI Light', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="68" font-weight="300" letter-spacing="1.2" fill="#f6f1ea">Tanora Vic</text>

    <text x="56" y="198" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="25" font-weight="300" letter-spacing="0.6" fill="#ded4c8">造一个能住在电脑里的角色。</text>

    <text x="56" y="228" font-family="Consolas, 'Cascadia Mono', monospace" font-size="12.5" letter-spacing="0.4" fill="#8d8579">a character shell that lives on your own machine.</text>

    <g>
      <line x1="56" y1="272" x2="286" y2="272" stroke="#e8a06a" stroke-opacity="0.42"/>
      <circle cx="292" cy="272" r="2" fill="#e8a06a" opacity="0.7"/>
    </g>

    <g>
      <rect x="56" y="296" width="352" height="34" rx="17" fill="#ffffff" fill-opacity="0.035" stroke="#e8a06a" stroke-opacity="0.26"/>
      <text x="232" y="318" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="10.5" letter-spacing="1.9" fill="#c3b6a6">LOCAL-FIRST · SELF-HOSTED · APACHE-2.0</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="379" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
