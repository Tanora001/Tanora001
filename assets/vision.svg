<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" aria-label="愿景：能住进去的世界、落回现实的福利、住在这里的人">
<defs>
    <linearGradient id="vibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/><stop offset="0.55" stop-color="#0c1017"/><stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="451" rx="16" fill="url(#vibg)" stroke="rgba(255,255,255,0.08)"/>
<defs>
  <linearGradient id="vline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e8a06a" stop-opacity="0"/><stop offset="0.35" stop-color="#e8a06a" stop-opacity="0.55"/><stop offset="1" stop-color="#7f9dc9" stop-opacity="0"/>
  </linearGradient>
</defs>
<text x="48" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10.5" letter-spacing="1.6" fill="#6f675c" text-anchor="start">THE WORLD · 三根柱子</text>
<text x="952" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#6f675c" text-anchor="end" opacity="1" letter-spacing="0">缺一根都撑不住</text>
<rect x="48" y="60" width="904" height="1" fill="url(#vline)"/>
<text x="48" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#e8a06a" text-anchor="start">01</text><text x="48" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="300" fill="#ece7e0" text-anchor="start" opacity="1" letter-spacing="0">能住进去的世界</text><rect x="48" y="162" width="26" height="1" fill="#e8a06a" opacity="0.75"/><text x="48" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">有房间、有街、有人的作息和光影。</text><text x="48" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">坐下喝杯茶；也能把现实里放不下的</text><text x="48" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">东西，带进来放一会儿。</text><text x="354" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#7f9dc9" text-anchor="start">02</text><text x="354" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="300" fill="#ece7e0" text-anchor="start" opacity="1" letter-spacing="0">落回现实的福利</text><rect x="354" y="162" width="26" height="1" fill="#7f9dc9" opacity="0.75"/><text x="354" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">社区、医疗、住房、学业。</text><text x="354" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">同一套账本，写得清、查得到；</text><text x="354" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">不靠口号，靠真花出去的钱。</text><text x="660" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10" letter-spacing="2" fill="#a996c4" text-anchor="start">03</text><text x="660" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="300" fill="#ece7e0" text-anchor="start" opacity="1" letter-spacing="0">住在这里的人</text><rect x="660" y="162" width="26" height="1" fill="#a996c4" opacity="0.75"/><text x="660" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">这里的人不是流量。</text><text x="660" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">规则一起写，收益一起分；</text><text x="660" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">不满意，可以改。</text>
<text x="48" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="300" fill="#d9d2c8" text-anchor="start" opacity="1" letter-spacing="0">先让人过得好一点，再谈这个世界能有多大。</text>
<text x="952" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="10" letter-spacing="1.6" fill="#6f675c" text-anchor="end">2026 · 第一年</text>
<rect x="48" y="360" width="904" height="1" fill="rgba(255,255,255,0.08)"/>
<text x="48" y="392" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">AI 让「亲身经历」可以按需定制：剑与魔法、龙与地下城、重来一次的人生，或者再见一面没来得及告别的人。</text>
<text x="48" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#a79e93" text-anchor="start" opacity="1" letter-spacing="0">它也确实能让人躲一会儿。我不打算美化这件事，只希望躲完还能回去把日子过下去。</text>
</svg>